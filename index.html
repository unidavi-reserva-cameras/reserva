<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reserva de Câmeras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#17140f;
    --bg-panel:#211d16;
    --bg-panel-2:#2a2418;
    --text:#f3ecdd;
    --text-dim:#b4a991;
    --accent:#e8a33d;
    --accent-soft:#3a2f1c;
    --ok:#5f8a72;
    --ok-soft:#20281f;
    --pending:#d9c46a;
    --pending-soft:#2c2818;
    --danger:#c1553b;
    --danger-soft:#2c1c17;
    --line:#3a342a;
    --on-accent:#1c1608;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .app{max-width:1000px;margin:0 auto;padding:28px 20px 60px;}

  /* header */
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px;}
  .masthead h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;letter-spacing:0.5px;margin:0;text-transform:uppercase;}
  .masthead .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);margin-top:4px;letter-spacing:0.5px;}
  .stats{display:flex;gap:18px;font-family:'IBM Plex Mono',monospace;}
  .stat{text-align:right;}
  .stat .n{font-size:22px;color:var(--accent);font-weight:500;}
  .stat .l{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}

  /* tabs */
  .tabs{display:flex;gap:2px;margin-bottom:22px;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content;}
  .tab{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:0.5px;text-transform:uppercase;padding:10px 18px;background:var(--bg-panel);color:var(--text-dim);cursor:pointer;border:none;transition:background .15s,color .15s;}
  .tab.active{background:var(--accent);color:var(--on-accent);font-weight:600;}
  .tab:not(.active):hover{background:var(--bg-panel-2);color:var(--text);}

  .panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:22px;}
  .panel + .panel{margin-top:16px;}

  /* film sprocket strip */
  .sprockets{display:flex;gap:6px;padding:0 2px 14px;}
  .sprockets span{width:6px;height:6px;border-radius:1px;background:var(--line);}

  h2.section-title{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.5px;font-size:20px;margin:0 0 14px;color:var(--text);}

  /* calendar */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-nav button{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;}
  .cal-nav button:hover{border-color:var(--accent);color:var(--accent);}
  .cal-month{font-family:'Barlow Condensed',sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:1px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);text-align:center;padding-bottom:4px;text-transform:uppercase;}
  .cal-day{min-height:78px;border:1px solid var(--line);border-radius:6px;padding:5px 5px;background:var(--bg-panel-2);position:relative;}
  .cal-day.empty{background:transparent;border-color:transparent;}
  .cal-day .dnum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
  .cal-day.today .dnum{color:var(--accent);font-weight:600;}
  .cal-day.selected{outline:2px solid var(--accent);outline-offset:-2px;}
  .cal-chip{font-size:10px;line-height:1.3;background:var(--danger-soft);color:var(--danger);border-left:2px solid var(--danger);border-radius:3px;padding:1px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default;}
  .cal-chip.pending{background:var(--pending-soft);color:var(--pending);border-color:var(--pending);}

  /* camera cards */
  .cam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .cam-card{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg-panel-2);position:relative;cursor:pointer;transition:border-color .15s;}
  .cam-card:hover{border-color:var(--accent);}
  .cam-card .iris{width:16px;height:16px;border-radius:50%;border:2px solid var(--text-dim);position:absolute;top:12px;right:12px;transition:transform .2s, border-color .2s;}
  .cam-card:hover .iris{transform:scale(0.7);border-color:var(--accent);}
  .cam-card .name{font-family:'Barlow Condensed',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:6px;padding-right:22px;}
  .badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;padding:2px 7px;border-radius:20px;}
  .badge.free{background:var(--ok-soft);color:var(--ok);}
  .badge.busy{background:var(--danger-soft);color:var(--danger);}
  .badge.late{background:var(--danger);color:#fff;font-weight:600;}

  /* form */
  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dim);margin-bottom:5px;margin-top:14px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:9px 10px;font-family:'Inter',sans-serif;font-size:14px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  textarea{resize:vertical;min-height:60px;}
  .btn{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.5px;font-size:16px;background:var(--accent);color:var(--on-accent);border:none;border-radius:6px;padding:10px 20px;cursor:pointer;font-weight:600;margin-top:18px;}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.small{font-size:13px;padding:6px 12px;margin-top:0;}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .msg{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:12px;padding:8px 10px;border-radius:6px;}
  .msg.ok{background:var(--ok-soft);color:var(--ok);}
  .msg.warn{background:var(--pending-soft);color:var(--pending);}
  .msg.err{background:var(--danger-soft);color:var(--danger);}

  /* requests list */
  .req-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .req-row:last-child{border-bottom:none;}
  .req-row.late{border-left:3px solid var(--danger);padding-left:10px;}
  .req-main{font-size:14px;}
  .req-main b{color:var(--text);}
  .req-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);margin-top:2px;}
  .req-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .req-actions input[type=date]{width:auto;padding:5px 8px;font-size:13px;}
  .empty-note{color:var(--text-dim);font-size:13px;padding:20px 4px;text-align:center;font-family:'IBM Plex Mono',monospace;}

  .auth-gate{max-width:320px;margin:20px auto;text-align:center;}
  .auth-gate input{text-align:left;font-family:'Inter',sans-serif;font-size:14px;}

  .admin-manage{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .cam-tag{display:flex;align-items:center;gap:6px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .cam-tag button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;padding:0 4px;}

  html, body{overflow-x:hidden;}
  @media(max-width:640px){
    body{font-size:14px;}
    .app{padding:16px 12px 40px;}
    .masthead h1{font-size:28px;}
    .tab{padding:9px 12px;font-size:14px;}
    .stats .n{font-size:18px;}
    .row2{grid-template-columns:1fr;}
    .cal-day{min-height:48px;padding:3px;}
    .cal-chip{font-size:7px;padding:0 2px;}
    .cam-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  }

  /* modal de disponibilidade */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,8,5,0.72);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:420px;width:100%;max-height:85vh;overflow:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .cal-day.booked{background:var(--danger-soft);border-color:var(--danger);}
  .cal-day.pendingday{background:var(--pending-soft);border-color:var(--pending);}
  .cal-day.freeday{background:var(--ok-soft);border-color:var(--ok);cursor:pointer;}
  .cal-day.freeday:hover{border-color:var(--accent);}
  .cal-day.pastday{opacity:0.35;}
  .cal-day.sel-edge{outline:2px solid var(--accent);outline-offset:-2px;}
  .cal-day.sel-range{background:var(--accent-soft);border-color:var(--accent);}
  .legend{display:flex;gap:14px;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);flex-wrap:wrap;}
  .legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--bg-panel-2);border:1px solid var(--line);margin-right:5px;vertical-align:middle;}
  .legend-dot.booked{background:var(--danger-soft);border-color:var(--danger);}
  .legend-dot.pendingday{background:var(--pending-soft);border-color:var(--pending);}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="masthead">
    <div>
      <h1>Reserva de Câmeras</h1>
      <div class="sub" id="subtitle">carregando...</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="agenda">Agenda</button>
    <button class="tab" data-tab="solicitar">Solicitar</button>
    <button class="tab" data-tab="admin">Administração</button>
  </div>

  <div id="view"></div>
</div>
<div id="modalRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>
(function(){
  // Se o Firebase não carregou (sem internet ou script bloqueado), avisa em vez de quebrar.
  if(!window.firebase){
    document.getElementById('subtitle').textContent = 'erro ao carregar';
    document.getElementById('view').innerHTML = `<div class="panel"><div class="msg err">Não foi possível carregar o sistema (falha de conexão ou bloqueio de scripts). Verifique a internet e recarregue a página.</div></div>`;
    return;
  }

  // =====================================================================
  // 1) COLE AQUI A CONFIGURAÇÃO DO SEU PROJETO FIREBASE (passo 3 do guia)
  // =====================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAGTBcfoVBzbeSj9OR4D6rcEO7cLBb-Wkk",
    authDomain: "sistema-de-reservas-c4aa2.firebaseapp.com",
    projectId: "sistema-de-reservas-c4aa2",
    storageBucket: "sistema-de-reservas-c4aa2.firebasestorage.app",
    messagingSenderId: "593957438680",
    appId: "1:593957438680:web:4d78bfcbc4cddb3a7883ad",
    measurementId: "G-D5Y330PCSX"
  };
  // =====================================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const COLLECTION = 'reserva-cameras';
  const RES_COLLECTION = 'reserva_cameras_reservations';
  // Dados pessoais (nome completo, e-mail, observações) ficam nesta coleção,
  // que só os professores conseguem ler. A agenda pública mostra só o nome abreviado.
  const PRIV_COLLECTION = 'reserva_cameras_private';

  // =====================================================================
  // 2) COLE AQUI A CONFIGURAÇÃO DO EMAILJS (para o e-mail de confirmação)
  //    Guia: crie conta em emailjs.com → Email Services → Email Templates
  // =====================================================================
  const emailjsConfig = {
    publicKey: "6oo-g_XpASRAjcd1f",
    serviceId: "service_hf3hnzm",
    templateId: "template_tanybzr"
  };
  // =====================================================================
  if(window.emailjs && emailjsConfig.publicKey !== "SUA_PUBLIC_KEY"){
    emailjs.init({ publicKey: emailjsConfig.publicKey });
  }

  // r precisa ter os dados pessoais (use full(r) quando vier da lista pública)
  async function sendConfirmationEmail(r, statusTitle, statusMessage){
    if(!r.email) return;
    if(!window.emailjs || emailjsConfig.publicKey === "SUA_PUBLIC_KEY") return; // não configurado ainda
    try{
      await emailjs.send(emailjsConfig.serviceId, emailjsConfig.templateId, {
        to_email: r.email,
        to_name: r.studentName,
        camera_name: camName(r.cameraId),
        start_date: r.startDate,
        end_date: r.endDate,
        status_title: statusTitle,
        status_message: statusMessage
      });
    }catch(e){ console.error('Erro ao enviar e-mail', e); }
  }

  // =====================================================================
  // 3) PROFESSORES — cada um recebe notificação só das suas solicitações
  //    e faz login com e-mail + senha (configurado no Firebase Authentication)
  //    IMPORTANTE: se mudar esta lista, mude também a lista nas regras do
  //    Firestore (arquivo firestore.rules). Só esses e-mails podem alterar dados.
  // =====================================================================
  const PROFESSORS = [
    { name: "Gabriel Garcia", email: "gabrielgarcia@unidavi.edu.br" },
    { name: "Jean Caetano", email: "prof.jean.caetano@unidavi.edu.br" },
    { name: "Sandro Andrade", email: "sandroa@unidavi.edu.br" }
  ];
  // =====================================================================

  async function notifyProfessor(r){
    if(!r.professorEmail) return;
    if(!window.emailjs || emailjsConfig.publicKey === "SUA_PUBLIC_KEY") return;
    const adminLink = location.origin + location.pathname + '?admin=1';
    try{
      await emailjs.send(emailjsConfig.serviceId, emailjsConfig.templateId, {
        to_email: r.professorEmail,
        to_name: r.professorName || 'Professor(a)',
        camera_name: camName(r.cameraId),
        start_date: r.startDate,
        end_date: r.endDate,
        status_title: 'Nova solicitação de reserva',
        status_message: `${r.studentName} (${r.email}), Fase ${r.fase || '—'}, solicitou o equipamento "${camName(r.cameraId)}" para o período de ${r.startDate} até ${r.endDate}. Acesse o link abaixo para aprovar ou recusar.`,
        admin_link: adminLink
      });
    }catch(e){ console.error('Erro ao notificar professor', e); }
  }

  let cameras = [];
  let reservations = [];
  let privById = {};          // dados pessoais por id de reserva (só para professores logados)
  let unsubPrivate = null;
  let currentTab = 'agenda';
  let calMonth = new Date().getMonth();
  let calYear = new Date().getFullYear();
  let agendaSelectedDate = todayStr();
  let modalCamId = null;
  let modalMonth = new Date().getMonth();
  let modalYear = new Date().getFullYear();
  let modalSelStart = null;
  let modalSelEnd = null;
  let carryOverRequest = null;
  let currentUser = null;
  let manualFormOpen = false;
  let returnFormId = null;    // reserva com o campo "data de devolução" aberto
  let loaded = false;
  let loadError = false;

  const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  function uid(){ return Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,6); }
  function pad2(n){ return String(n).padStart(2,'0'); }
  // Data no fuso local. (toISOString() usa UTC: no Brasil, depois das 21h viraria o dia seguinte.)
  function toDateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function todayStr(){ return toDateStr(new Date()); }
  function formatDateBR(dateStr){
    if(!dateStr) return '—';
    const [y,m,d] = String(dateStr).split('-');
    return `${d}/${m}/${y}`;
  }
  function daysBetween(a, b){
    return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
  }

  // Todo texto digitado por alguém passa por aqui antes de entrar no HTML,
  // para que um nome ou observação não possa virar código na página.
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // "Maria da Silva Souza" → "Maria S." (o que aparece na agenda pública)
  function shortName(fullName){
    const parts = String(fullName || '').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '';
    return parts.length > 1 ? parts[0] + ' ' + parts[parts.length-1][0].toUpperCase() + '.' : parts[0];
  }
  function publicName(r){ return r.studentShort || shortName(r.studentName) || '—'; }
  // Junta os dados públicos com os pessoais (quando o professor está logado)
  function full(r){ return Object.assign({}, r, privById[r.id] || {}); }
  function fullName(r){ return full(r).studentName || r.studentShort || '—'; }

  function isProfessor(user){
    const email = ((user && user.email) || '').toLowerCase();
    return PROFESSORS.some(p => p.email.toLowerCase() === email);
  }
  function errText(e){ return (e && (e.code || e.message)) || 'erro desconhecido'; }

  function exportHistoryPDF(){
    if(!window.jspdf){ alert('A biblioteca de PDF ainda não carregou. Aguarde um instante e tente de novo.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(16);
    doc.text('Histórico de Retiradas — Reserva de Câmeras', 14, 18);
    doc.setFontSize(10);
    doc.setTextColor(120);
    doc.text('Gerado em ' + new Date().toLocaleString('pt-BR'), 14, 24);

    const rows = [...reservations]
      .sort((a,b)=> b.startDate.localeCompare(a.startDate))
      .map(r => [
        camName(r.cameraId),
        fullName(r),
        r.fase ? ('Fase '+r.fase) : '—',
        r.professorName || '—',
        formatDateBR(r.startDate),
        formatDateBR(r.endDate),
        r.status==='approved' ? 'Aprovada' : r.status==='pending' ? 'Pendente' : 'Recusada',
        r.returned ? ('Devolvida em ' + formatDateBR(r.returnedAt)) : isOverdue(r) ? 'ATRASADA' : (r.status==='approved' ? 'Em posse do aluno' : '—')
      ]);

    doc.autoTable({
      startY: 30,
      head: [['Equipamento','Aluno','Fase','Professor','Retirada','Devolução','Status','Devolução real']],
      body: rows,
      styles: { fontSize: 8, cellPadding: 3 },
      headStyles: { fillColor: [29,78,115] },
      alternateRowStyles: { fillColor: [245,243,236] }
    });

    doc.save('historico-retiradas-cameras.pdf');
  }

  function rangesOverlap(aStart,aEnd,bStart,bEnd){
    return aStart <= bEnd && bStart <= aEnd;
  }

  // Aprovada, ainda não devolvida e já passou da data de devolução
  function isOverdue(r){
    return r.status==='approved' && !r.returned && r.endDate < todayStr();
  }

  function effectiveEnd(r){
    if(r.returned && r.returnedAt) return r.returnedAt;
    // Atrasada: continua ocupada pelo menos até hoje, até alguém registrar a devolução
    if(isOverdue(r)) return todayStr();
    return r.endDate;
  }

  async function loadState(){
    try{
      const camDoc = await db.collection(COLLECTION).doc('cameras').get();
      cameras = camDoc.exists ? (camDoc.data().list || []) : [];
      const snap = await db.collection(RES_COLLECTION).get();
      reservations = snap.docs.map(d=>d.data());
    }catch(e){
      // Não cria nem salva nada se a leitura falhar: só avisa.
      console.error('erro ao carregar dados', e);
      loadError = true;
      return;
    }
    loaded = true;

    // Mantém tudo sincronizado em tempo real entre todos que estiverem com a página aberta.
    db.collection(COLLECTION).doc('cameras').onSnapshot(doc=>{
      cameras = doc.exists ? (doc.data().list || []) : [];
      refreshView();
    }, e=>console.error('erro ao sincronizar câmeras', e));
    db.collection(RES_COLLECTION).onSnapshot(snap=>{
      reservations = snap.docs.map(d=>d.data());
      refreshView();
    }, e=>console.error('erro ao sincronizar reservas', e));

    auth.onAuthStateChanged(user=>{
      currentUser = user;
      if(unsubPrivate){ unsubPrivate(); unsubPrivate = null; }
      privById = {};
      if(user && isProfessor(user)){
        unsubPrivate = db.collection(PRIV_COLLECTION).onSnapshot(snap=>{
          privById = {};
          snap.docs.forEach(d=>{ privById[d.id] = d.data(); });
          refreshView();
        }, e=>console.error('erro ao carregar dados pessoais', e));
        migratePrivateData().catch(e=>console.error('erro na migração dos dados pessoais', e));
      }
      if(currentTab==='admin') renderAdmin();
    });
  }

  // Re-renderiza quando chegam dados novos, sem apagar o que alguém esteja digitando.
  function isTyping(){
    const a = document.activeElement;
    return !!(a && a.closest && a.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }
  function refreshView(){
    if(!loaded) return;
    renderStats();
    if(currentTab==='agenda') renderAgenda();
    else if(currentTab==='admin' && currentUser && !manualFormOpen && !returnFormId && !isTyping()) renderAdmin();
    if(modalCamId) renderCamModal();
  }

  // Reservas antigas tinham nome completo, e-mail e observações no documento público.
  // Na primeira vez que um professor entra, esses dados são movidos para a coleção privada.
  async function migratePrivateData(){
    const legacy = reservations.filter(r => ['studentName','email','notes','professorEmail'].some(k => k in r));
    if(!legacy.length) return;
    const del = firebase.firestore.FieldValue.delete();
    for(let i=0; i<legacy.length; i+=200){
      const batch = db.batch();
      legacy.slice(i, i+200).forEach(r=>{
        batch.set(privRef(r.id), {
          studentName: r.studentName || '', email: r.email || '',
          notes: r.notes || '', professorEmail: r.professorEmail || ''
        }, {merge: true});
        batch.update(resRef(r.id), {
          studentShort: r.studentShort || shortName(r.studentName),
          studentName: del, email: del, notes: del, professorEmail: del
        });
      });
      await batch.commit();
    }
    console.log('Dados pessoais migrados:', legacy.length, 'reserva(s).');
  }

  // Altera a lista de câmeras dentro de uma transação: se dois professores
  // editarem ao mesmo tempo, um não apaga a mudança do outro.
  async function updateCameras(mutate){
    const ref = db.collection(COLLECTION).doc('cameras');
    await db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      const list = snap.exists ? (snap.data().list || []) : [];
      tx.set(ref, {list: mutate(list.slice())});
    });
  }

  function resRef(id){ return db.collection(RES_COLLECTION).doc(id); }
  function privRef(id){ return db.collection(PRIV_COLLECTION).doc(id); }

  // As funções abaixo NÃO escondem erros: quem chama mostra a mensagem ao usuário.
  async function createReservation(pub, priv){
    const batch = db.batch();
    batch.set(resRef(pub.id), pub);
    batch.set(privRef(pub.id), priv);
    await batch.commit();
  }
  async function updateReservationDoc(id, changes){
    await resRef(id).update(changes);
  }
  async function deleteReservation(id){
    const batch = db.batch();
    batch.delete(resRef(id));
    batch.delete(privRef(id));
    await batch.commit();
  }

  function camName(id){
    const c = cameras.find(c=>c.id===id);
    return c ? c.name : '(removida)';
  }

  function isCameraFreeOnDate(camId, dateStr){
    return !reservations.some(r => r.cameraId===camId && r.status==='approved' && rangesOverlap(r.startDate, effectiveEnd(r), dateStr, dateStr));
  }
  function isCameraFreeToday(camId){
    return isCameraFreeOnDate(camId, todayStr());
  }
  function overdueFor(camId){
    return reservations.find(r => r.cameraId===camId && isOverdue(r));
  }

  function renderStats(){
    const pending = reservations.filter(r=>r.status==='pending').length;

    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="n">${cameras.length - approvedToday}</div><div class="l">Livres hoje</div></div>
      <div class="stat"><div class="n">${pending}</div><div class="l">Pendentes</div></div>
    `;
  }

  function sprockets(n){
    let s = '<div class="sprockets">';
    for(let i=0;i<n;i++) s += '<span></span>';
    s += '</div>';
    return s;
  }

  // ---------- MODAL DE DISPONIBILIDADE POR EQUIPAMENTO ----------
  function openCamModal(camId){
    modalCamId = camId;
    modalMonth = new Date().getMonth();
    modalYear = new Date().getFullYear();
    modalSelStart = null;
    modalSelEnd = null;
    renderCamModal();
  }

  function closeCamModal(){
    modalCamId = null;
    modalSelStart = null;
    modalSelEnd = null;
    document.getElementById('modalRoot').innerHTML = '';
  }

  function dayStatus(camId, dateStr){
    const dayRes = reservations.filter(r => r.cameraId===camId && r.status!=='rejected' && rangesOverlap(r.startDate, effectiveEnd(r), dateStr, dateStr));
    if(dayRes.some(r=>r.status==='approved')) return 'booked';
    if(dayRes.some(r=>r.status==='pending')) return 'pendingday';
    return 'freeday';
  }

  function isRangeClear(camId, start, end){
    let d = new Date(start+'T00:00:00');
    const endD = new Date(end+'T00:00:00');
    while(d <= endD){
      if(dayStatus(camId, toDateStr(d)) === 'booked') return false;
      d.setDate(d.getDate()+1);
    }
    return true;
  }

  function handleDayClick(dateStr){
    const status = dayStatus(modalCamId, dateStr);
    if(status !== 'freeday' || dateStr < todayStr()) return;

    if(!modalSelStart || !modalSelEnd){
      // ainda escolhendo o intervalo inicial (retirada e/ou devolução)
      if(!modalSelStart){
        modalSelStart = dateStr;
      }else if(dateStr < modalSelStart){
        modalSelStart = dateStr;
      }else if(isRangeClear(modalCamId, modalSelStart, dateStr)){
        modalSelEnd = dateStr;
      }else{
        alert('Esse período inclui um dia já reservado. Escolha um intervalo sem conflitos.');
        modalSelStart = dateStr;
        modalSelEnd = null;
      }
    }else{
      // já existe um intervalo completo — clicar fora dele estende a reserva, clicar dentro reinicia
      if(dateStr > modalSelEnd){
        if(isRangeClear(modalCamId, modalSelStart, dateStr)) modalSelEnd = dateStr;
        else alert('Esse período inclui um dia já reservado. Escolha um intervalo sem conflitos.');
      }else if(dateStr < modalSelStart){
        if(isRangeClear(modalCamId, dateStr, modalSelEnd)) modalSelStart = dateStr;
        else alert('Esse período inclui um dia já reservado. Escolha um intervalo sem conflitos.');
      }else{
        modalSelStart = dateStr;
        modalSelEnd = null;
      }
    }
    renderCamModal();
  }

  function renderCamModal(){
    const cam = cameras.find(c=>c.id===modalCamId);
    if(!cam){ closeCamModal(); return; }

    const first = new Date(modalYear, modalMonth, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(modalYear, modalMonth+1, 0).getDate();
    const today = todayStr();

    let cells = '';
    for(let i=0;i<startDow;i++) cells += '<div class="cal-day empty"></div>';
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = modalYear+'-'+pad2(modalMonth+1)+'-'+pad2(d);
      const status = dayStatus(modalCamId, dateStr);
      const isToday = dateStr === today;
      const isPast = dateStr < today;
      let cls = ['cal-day', status];
      if(isToday) cls.push('today');
      if(isPast) cls.push('pastday');
      if(dateStr===modalSelStart || dateStr===modalSelEnd) cls.push('sel-edge');
      if(modalSelStart && modalSelEnd && dateStr > modalSelStart && dateStr < modalSelEnd) cls.push('sel-range');
      cells += `<div class="${cls.join(' ')}" data-date="${dateStr}"><div class="dnum">${d}</div></div>`;
    }

    const dow = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
    const canSubmit = modalSelStart && modalSelEnd;
    const rangeLabel = modalSelStart
      ? (modalSelEnd ? `${formatDateBR(modalSelStart)} → ${formatDateBR(modalSelEnd)}` : `${formatDateBR(modalSelStart)} → selecione a devolução`)
      : 'Clique num dia livre para escolher a retirada';

    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-panel">
          <div class="modal-head">
            <h2 class="section-title" style="margin:0;">${esc(cam.name)}</h2>
            <button class="btn ghost small" id="closeModal">Fechar ✕</button>
          </div>
          <div class="cal-nav">
            <button id="modalPrev">← anterior</button>
            <div class="cal-month">${MONTHS[modalMonth]} ${modalYear}</div>
            <button id="modalNext">próximo →</button>
          </div>
          <div class="cal-grid">${dow}${cells}</div>
          <div class="legend">
            <div><span class="legend-dot booked"></span>Reservado</div>
            <div><span class="legend-dot pendingday"></span>Pendente</div>
            <div><span class="legend-dot freeday"></span>Livre</div>
          </div>
          <div class="req-meta" style="margin-top:12px;">${rangeLabel}</div>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn ghost small" id="clearSel">Limpar seleção</button>
            <button class="btn" id="modalSolicitar" style="flex:1;margin-top:0;" ${canSubmit ? '' : 'disabled'}>Solicitar estas datas</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('closeModal').onclick = closeCamModal;
    document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') closeCamModal(); };
    document.getElementById('modalPrev').onclick = ()=>{ modalMonth--; if(modalMonth<0){modalMonth=11;modalYear--;} renderCamModal(); };
    document.getElementById('modalNext').onclick = ()=>{ modalMonth++; if(modalMonth>11){modalMonth=0;modalYear++;} renderCamModal(); };
    document.getElementById('clearSel').onclick = ()=>{ modalSelStart=null; modalSelEnd=null; renderCamModal(); };
    document.querySelectorAll('#modalRoot .cal-day[data-date]').forEach(el=>{
      el.onclick = ()=> handleDayClick(el.dataset.date);
    });
    if(canSubmit){
      document.getElementById('modalSolicitar').onclick = ()=>{
        carryOverRequest = { camId: modalCamId, start: modalSelStart, end: modalSelEnd };
        closeCamModal();
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.querySelector('.tab[data-tab="solicitar"]').classList.add('active');
        currentTab = 'solicitar';
        render();
      };
    }
  }

  // ---------- SOLICITAR VIEW ----------
  function getAvailableCameras(start, end){
    if(!start || !end) return cameras;
    return cameras.filter(c => !reservations.some(r =>
      r.cameraId === c.id && r.status === 'approved' && rangesOverlap(r.startDate, effectiveEnd(r), start, end)
    ));
  }

  function refreshCameraOptions(){
    const start = document.getElementById('f-start').value;
    const end = document.getElementById('f-end').value;
    const selectEl = document.getElementById('f-camera');
    const noteEl = document.getElementById('availNote');
    const prevVal = selectEl.value;

    const avail = getAvailableCameras(start, end);
    const unavailableCount = cameras.length - avail.length;

    selectEl.innerHTML = avail.length
      ? avail.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')
      : `<option value="">Nenhum equipamento livre nesse período</option>`;

    if(avail.some(c=>c.id===prevVal)) selectEl.value = prevVal;
    selectEl.disabled = avail.length === 0;

    if(!start || !end){
      noteEl.textContent = 'Escolha as datas para ver quais equipamentos estão livres.';
    }else if(unavailableCount > 0){
      noteEl.textContent = `${unavailableCount} equipamento(s) indisponível(is) nesse período — já reservado(s).`;
    }else{
      noteEl.textContent = '';
    }
  }

  function renderSolicitar(){
    document.getElementById('view').innerHTML = `
      <div class="panel">
        <h2 class="section-title">Solicitar reserva</h2>
        <label>Seu nome</label>
        <input type="text" id="f-name" placeholder="Nome completo" maxlength="120">
        <label>Seu e-mail</label>
        <input type="text" id="f-email" placeholder="voce@exemplo.com" maxlength="120">
        <label>Fase do curso</label>
        <select id="f-fase">
          <option value="1">Fase 1</option>
          <option value="2">Fase 2</option>
          <option value="3">Fase 3</option>
          <option value="4">Fase 4</option>
        </select>
        <label>Professor responsável</label>
        <select id="f-professor">
          ${PROFESSORS.map(p=>`<option value="${esc(p.email)}">${esc(p.name)}</option>`).join('')}
        </select>
        <div class="row2">
          <div>
            <label>Retirada</label>
            <input type="date" id="f-start" min="${todayStr()}">
          </div>
          <div>
            <label>Devolução</label>
            <input type="date" id="f-end" min="${todayStr()}">
          </div>
        </div>
        <label>Equipamento</label>
        <select id="f-camera"></select>
        <div class="req-meta" id="availNote" style="margin-top:6px;"></div>
        <label>Observações (opcional)</label>
        <textarea id="f-notes" placeholder="Ex: uso para trabalho da disciplina X" maxlength="1000"></textarea>
        <button class="btn" id="submitReq">Enviar solicitação</button>
        <div id="formMsg"></div>
      </div>
    `;

    refreshCameraOptions();

    if(carryOverRequest){
      document.getElementById('f-start').value = carryOverRequest.start;
      document.getElementById('f-end').value = carryOverRequest.end;
      refreshCameraOptions();
      const selectEl = document.getElementById('f-camera');
      if([...selectEl.options].some(o=>o.value===carryOverRequest.camId)){
        selectEl.value = carryOverRequest.camId;
      }
      carryOverRequest = null;
    }

    document.getElementById('f-start').onchange = refreshCameraOptions;
    document.getElementById('f-end').onchange = refreshCameraOptions;

    const submitBtn = document.getElementById('submitReq');
    submitBtn.onclick = async ()=>{
      const name = document.getElementById('f-name').value.trim();
      const email = document.getElementById('f-email').value.trim();
      const professorEmail = document.getElementById('f-professor').value;
      const fase = document.getElementById('f-fase').value;
      const professorName = (PROFESSORS.find(p=>p.email===professorEmail)||{}).name || '';
      const camId = document.getElementById('f-camera').value;
      const start = document.getElementById('f-start').value;
      const end = document.getElementById('f-end').value;
      const notes = document.getElementById('f-notes').value.trim();
      const msgEl = document.getElementById('formMsg');

      if(!name || !email || !start || !end){
        msgEl.innerHTML = `<div class="msg err">Preencha nome, e-mail, data de retirada e devolução.</div>`;
        return;
      }
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
        msgEl.innerHTML = `<div class="msg err">Digite um e-mail válido.</div>`;
        return;
      }
      if(end < start){
        msgEl.innerHTML = `<div class="msg err">A data de devolução não pode ser antes da retirada.</div>`;
        return;
      }
      if(!camId){
        msgEl.innerHTML = `<div class="msg err">Nenhum equipamento disponível para essas datas — tente outro período.</div>`;
        return;
      }
      // Checagem final de conflito (garante mesmo se os dados mudaram entre a digitação e o envio)
      const conflict = reservations.some(r => r.cameraId===camId && r.status==='approved' && rangesOverlap(r.startDate, effectiveEnd(r), start, end));
      if(conflict){
        msgEl.innerHTML = `<div class="msg err">Esse equipamento acabou de ser reservado por outra pessoa nesse período. Escolha outro.</div>`;
        refreshCameraOptions();
        return;
      }

      const pub = {
        id: uid(), cameraId: camId, studentShort: shortName(name),
        professorName, fase,
        startDate: start, endDate: end,
        status: 'pending', requestedAt: new Date().toISOString(),
        returned: false, returnedAt: null
      };
      const priv = { studentName: name, email, notes, professorEmail };

      submitBtn.disabled = true;
      msgEl.innerHTML = `<div class="msg warn">Enviando...</div>`;
      try{
        await createReservation(pub, priv);
      }catch(e){
        console.error('erro ao criar reserva', e);
        msgEl.innerHTML = `<div class="msg err">Não foi possível enviar a solicitação. Verifique sua internet e tente de novo. Se o problema continuar, avise um professor. (${esc(errText(e))})</div>`;
        submitBtn.disabled = false;
        return;
      }
      // Só manda os e-mails depois que a reserva foi gravada de verdade
      const fullRes = Object.assign({}, pub, priv);
      sendConfirmationEmail(fullRes, 'Solicitação recebida', 'Sua solicitação de reserva foi registrada e está aguardando aprovação. Você receberá um novo e-mail assim que ela for avaliada.');
      notifyProfessor(fullRes);

      msgEl.innerHTML = `<div class="msg ok">Solicitação enviada! Você vai receber um e-mail de confirmação e outro quando ela for avaliada.</div>`;
      submitBtn.disabled = false;
      document.getElementById('f-name').value='';
      document.getElementById('f-email').value='';
      document.getElementById('f-notes').value='';
      refreshCameraOptions();
      renderStats();
    };
  }

        <div class="panel auth-gate">
          <h2 class="section-title">Sem permissão</h2>
          <div class="msg err">O usuário ${esc(currentUser.email)} não está na lista de professores deste sistema.</div>
          <button class="btn ghost" id="logoutBtn" style="width:100%">Sair</button>
        </div>
      `;
      document.getElementById('logoutBtn').onclick = ()=> auth.signOut();
      return;
    }

    const today = todayStr();
    const pending = reservations.filter(r=>r.status==='pending').sort((a,b)=>a.startDate.localeCompare(b.startDate));
    // Aprovadas e ainda não devolvidas aparecem todas (não só as recentes), com as atrasadas no topo
    const open = reservations.filter(r=>r.status==='approved' && !r.returned)
      .sort((a,b)=> (isOverdue(b)-isOverdue(a)) || a.endDate.localeCompare(b.endDate));
    const decided = reservations.filter(r=>r.status==='rejected' || r.returned)
      .sort((a,b)=>(b.requestedAt||'').localeCompare(a.requestedAt||'')).slice(0,15);
    const lateCount = open.filter(isOverdue).length;

    const returnControls = (r)=> returnFormId===r.id ? `
        <input type="date" id="ret-date" value="${today}" min="${esc(r.startDate)}" max="${today}">
        <button class="btn small" data-id="${esc(r.id)}" data-action="return-confirm">Confirmar devolução</button>
        <button class="btn small ghost" data-id="${esc(r.id)}" data-action="return-cancel">Cancelar</button>
      ` : `
        ${r.startDate <= today ? `<button class="btn small ghost" data-id="${esc(r.id)}" data-action="return-open">Registrar devolução</button>` : ''}
        <button class="btn small ghost" data-id="${esc(r.id)}" data-action="delete">Excluir</button>
      `;

    document.getElementById('view').innerHTML = `
      <div class="panel">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
          <h2 class="section-title" style="margin:0;">Olá, ${esc(currentUser.email)}</h2>
          <button class="btn ghost small" id="logoutBtn">Sair</button>
        </div>
        <h2 class="section-title">Solicitações pendentes (${pending.length})</h2>
        ${pending.length ? pending.map(r=>{ const f = full(r); return `
          <div class="req-row">
            <div class="req-main">
              <b>${esc(camName(r.cameraId))}</b> · ${esc(fullName(r))} · ${esc(f.email || 'sem e-mail')}
              <div class="req-meta">${esc(formatDateBR(r.startDate))} → ${esc(formatDateBR(r.endDate))}${f.notes ? ' · '+esc(f.notes) : ''} · Professor: ${esc(r.professorName || '—')}${r.fase ? ' · Fase '+esc(r.fase) : ''}</div>
            </div>
            <div class="req-actions">
              <button class="btn small" data-id="${esc(r.id)}" data-action="approve">Aprovar</button>
              <button class="btn small danger" data-id="${esc(r.id)}" data-action="reject">Recusar</button>
              <button class="btn small ghost" data-id="${esc(r.id)}" data-action="delete">Excluir</button>
            </div>
          </div>
        `;}).join('') : `<div class="empty-note">Nenhuma solicitação pendente.</div>`}
      </div>

      <div class="panel">
        <h2 class="section-title">Aprovadas a devolver (${open.length})${lateCount ? ` · <span style="color:var(--danger)">${lateCount} atrasada(s)</span>` : ''}</h2>
        ${open.length ? open.map(r=>{
          const late = isOverdue(r);
          return `
          <div class="req-row ${late?'late':''}">
            <div class="req-main">
              <b>${esc(camName(r.cameraId))}</b> · ${esc(fullName(r))}
              ${late ? `<span class="badge late">Atrasada há ${daysBetween(r.endDate, today)} dia(s)</span>` : ''}
              <div class="req-meta">${esc(formatDateBR(r.startDate))} → ${esc(formatDateBR(r.endDate))} · ${r.startDate > today ? 'ainda não retirada' : 'em posse do aluno'}${r.professorName ? ' · Professor: '+esc(r.professorName) : ''}</div>
            </div>
            <div class="req-actions">${returnControls(r)}</div>
          </div>`;
        }).join('') : `<div class="empty-note">Nenhum equipamento fora no momento.</div>`}
      </div>

      <div class="panel">
        ${manualFormOpen ? `
          <h2 class="section-title">Registrar retirada manual</h2>
          <div class="req-meta" style="margin-bottom:10px;">Para retiradas feitas fora do sistema (ex: direto com a coordenação). Datas passadas são permitidas e a reserva já entra como aprovada, associada a você.</div>
          <label>Nome do aluno</label>
          <input type="text" id="m-name" placeholder="Nome completo" maxlength="120">
          <label>E-mail (opcional)</label>
          <input type="text" id="m-email" placeholder="voce@exemplo.com" maxlength="120">
          <label>Fase do curso</label>
          <select id="m-fase">
            <option value="1">Fase 1</option>
            <option value="2">Fase 2</option>
            <option value="3">Fase 3</option>
            <option value="4">Fase 4</option>
          </select>
          <label>Equipamento</label>
          <select id="m-camera">
            ${cameras.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
          </select>
          <div class="row2">
            <div>
              <label>Retirada</label>
              <input type="date" id="m-start">
            </div>
            <div>
              <label>Devolução</label>
              <input type="date" id="m-end">
            </div>
          </div>
          <label>Observações (opcional)</label>
          <textarea id="m-notes" placeholder="Ex: retirada direto com a coordenação por urgência" maxlength="1000"></textarea>
          <div style="display:flex;gap:8px;">
            <button class="btn" id="submitManual">Registrar retirada</button>
            <button class="btn ghost" id="cancelManual">Cancelar</button>
          </div>
          <div id="manualMsg"></div>
        ` : `
          <button class="btn ghost" id="openManual" style="margin-top:0;width:100%;">+ Registrar retirada manual</button>
        `}
      </div>

      <div class="panel">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
          <h2 class="section-title" style="margin:0;">Histórico recente</h2>
          <button class="btn ghost small" id="exportPdfBtn">Exportar PDF</button>
        </div>
        ${decided.length ? decided.map(r=>`
          <div class="req-row">
            <div class="req-main">
              <b>${esc(camName(r.cameraId))}</b> · ${esc(fullName(r))}
              <div class="req-meta">${esc(formatDateBR(r.startDate))} → ${esc(formatDateBR(r.endDate))} · ${r.status==='approved' ? `<span style="color:var(--ok)">aprovada</span> · devolvida em ${esc(formatDateBR(r.returnedAt))}` : '<span style="color:var(--danger)">recusada</span>'}</div>
            </div>
            <div class="req-actions">
              <button class="btn small ghost" data-id="${esc(r.id)}" data-action="delete">Excluir</button>
            </div>
          </div>
        `).join('') : `<div class="empty-note">Sem histórico ainda.</div>`}
      </div>

      <div class="panel">
        <h2 class="section-title">Gerenciar equipamentos</h2>
        <div class="admin-manage" id="camList">
          ${cameras.map(c=>`
            <div class="cam-tag">
              <input type="text" class="cam-name-input" data-camid="${esc(c.id)}" value="${esc(c.name)}" maxlength="60" style="background:transparent;border:none;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;width:110px;padding:0;">
              <button data-remove="${esc(c.id)}" title="Remover equipamento">✕</button>
            </div>
          `).join('')}
        </div>
        <div class="req-meta" style="margin-top:6px;">Edite o nome e clique fora do campo (ou aperte Enter) para salvar.</div>
        <label>Adicionar equipamento</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="newCamName" placeholder="Nome do equipamento" maxlength="60">
          <button class="btn small" id="addCam">Adicionar</button>
        </div>
      </div>
    `;

    document.getElementById('view').querySelectorAll('.cam-name-input').forEach(inp=>{
      const commit = async ()=>{
        const id = inp.dataset.camid;
        const cam = cameras.find(c=>c.id===id);
        const newName = inp.value.trim();
        if(!cam || !newName || newName===cam.name) return;
        try{
          await updateCameras(list => list.map(c => c.id===id ? Object.assign({}, c, {name: newName}) : c));
        }catch(e){
          console.error('erro ao renomear equipamento', e);
          alert('Não foi possível salvar o novo nome. (' + errText(e) + ')');
          inp.value = cam.name;
        }
      };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ inp.blur(); } });
    });

    document.getElementById('logoutBtn').onclick = ()=>{ manualFormOpen = false; returnFormId = null; auth.signOut(); };
    document.getElementById('exportPdfBtn').onclick = exportHistoryPDF;

    document.getElementById('view').querySelectorAll('[data-action]').forEach(btn=>{
      btn.onclick = async ()=>{
        const r = reservations.find(x=>x.id===btn.dataset.id);
        if(!r) return;
        const action = btn.dataset.action;

        if(action==='return-open'){ returnFormId = r.id; renderAdmin(); return; }
        if(action==='return-cancel'){ returnFormId = null; renderAdmin(); return; }

        btn.disabled = true;
        try{
          if(action==='delete'){
            if(!confirm(`Excluir a reserva de ${fullName(r)} (${camName(r.cameraId)}, ${formatDateBR(r.startDate)} → ${formatDateBR(r.endDate)})? Essa ação não pode ser desfeita.`)){ btn.disabled = false; return; }
            await deleteReservation(r.id);
          }
          else if(action==='return-confirm'){
            const input = document.getElementById('ret-date').value;
            if(!/^\d{4}-\d{2}-\d{2}$/.test(input) || input < r.startDate || input > todayStr()){
              alert('Escolha uma data de devolução entre ' + formatDateBR(r.startDate) + ' e hoje.');
              btn.disabled = false;
              return;
            }
            await updateReservationDoc(r.id, { returned: true, returnedAt: input });
            returnFormId = null;
          }
          else if(action==='approve' || action==='reject'){
            if(action==='approve'){
              const conflict = reservations.some(o => o.id!==r.id && o.cameraId===r.cameraId && o.status==='approved' && rangesOverlap(o.startDate, effectiveEnd(o), r.startDate, r.endDate));
              if(conflict){
                alert('Não é possível aprovar: esse equipamento já tem outra reserva aprovada que se sobrepõe a este período. Recuse este pedido ou ajuste a outra reserva primeiro.');
                btn.disabled = false;
                return;
              }
              const late = reservations.find(o => o.id!==r.id && o.cameraId===r.cameraId && isOverdue(o));
              if(late && !confirm(`Atenção: o equipamento ${camName(r.cameraId)} está com devolução atrasada (${fullName(late)}, deveria ter voltado em ${formatDateBR(late.endDate)}). Aprovar mesmo assim?`)){
                btn.disabled = false;
                return;
              }
            }
            const status = action==='approve' ? 'approved' : 'rejected';
            await updateReservationDoc(r.id, { status });
            const fr = Object.assign(full(r), { status });
            if(status==='approved'){
              sendConfirmationEmail(fr, 'Reserva aprovada ✅', 'Sua reserva foi aprovada! Pode retirar o equipamento na data combinada.');
            }else{
              sendConfirmationEmail(fr, 'Reserva recusada', 'Sua solicitação de reserva não pôde ser aprovada para o período pedido. Entre em contato com o responsável para mais detalhes.');
            }
          }
        }catch(e){
          console.error('erro na ação '+action, e);
          alert('Não foi possível concluir a ação. Verifique a internet e tente de novo. (' + errText(e) + ')');
          btn.disabled = false;
          return;
        }
        renderAdmin(); renderStats();
      };
    });

    const openManualBtn = document.getElementById('openManual');
    if(openManualBtn) openManualBtn.onclick = ()=>{ manualFormOpen = true; renderAdmin(); };
    const cancelManualBtn = document.getElementById('cancelManual');
    if(cancelManualBtn) cancelManualBtn.onclick = ()=>{ manualFormOpen = false; renderAdmin(); };

    const submitManualBtn = document.getElementById('submitManual');
    if(submitManualBtn) submitManualBtn.onclick = async ()=>{
      const name = document.getElementById('m-name').value.trim();
      const email = document.getElementById('m-email').value.trim();
      const fase = document.getElementById('m-fase').value;
      const camId = document.getElementById('m-camera').value;
      const start = document.getElementById('m-start').value;
      const end = document.getElementById('m-end').value;
      const notes = document.getElementById('m-notes').value.trim();
      const msgEl = document.getElementById('manualMsg');

      if(!name || !start || !end){
        msgEl.innerHTML = `<div class="msg err">Preencha nome, data de retirada e devolução.</div>`;
        return;
      }
      if(end < start){
        msgEl.innerHTML = `<div class="msg err">A data de devolução não pode ser antes da retirada.</div>`;
        return;
      }
      if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
        msgEl.innerHTML = `<div class="msg err">Digite um e-mail válido, ou deixe em branco.</div>`;
        return;
      }
      const conflict = reservations.some(r => r.cameraId===camId && r.status==='approved' && rangesOverlap(r.startDate, effectiveEnd(r), start, end));

      const professorEntry = PROFESSORS.find(p=>p.email.toLowerCase()===(currentUser.email||'').toLowerCase());
      const pub = {
        id: uid(), cameraId: camId, studentShort: shortName(name),
        professorName: professorEntry ? professorEntry.name : currentUser.email, fase,
        startDate: start, endDate: end,
        status: 'approved', requestedAt: new Date().toISOString(),
        returned: false, returnedAt: null
      };
      const priv = { studentName: name, email, notes, professorEmail: currentUser.email };

      submitManualBtn.disabled = true;
      try{
        await createReservation(pub, priv);
      }catch(e){
        console.error('erro ao registrar retirada manual', e);
        msgEl.innerHTML = `<div class="msg err">Não foi possível registrar a retirada. (${esc(errText(e))})</div>`;
        submitManualBtn.disabled = false;
        return;
      }
      if(email) sendConfirmationEmail(Object.assign({}, pub, priv), 'Retirada registrada ✅', 'Sua retirada do equipamento foi registrada manualmente pela administração.');

      manualFormOpen = false;
      renderAdmin(); renderStats();
      if(conflict) alert('Retirada registrada, mas havia outra reserva aprovada sobreposta nesse período — confira a lista.');
    };

    document.getElementById('addCam').onclick = async ()=>{
      const nameEl = document.getElementById('newCamName');
      const name = nameEl.value.trim();
      if(!name) return;
      try{
        await updateCameras(list => list.concat([{id: uid(), name}]));
        nameEl.value = '';
      }catch(e){
        console.error('erro ao adicionar equipamento', e);
        alert('Não foi possível adicionar o equipamento. (' + errText(e) + ')');
      }
    };
    document.getElementById('view').querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.remove;
        const active = reservations.filter(r => r.cameraId===id && (r.status==='pending' || (r.status==='approved' && !r.returned))).length;
        const warning = active ? `\n\nAtenção: há ${active} reserva(s) pendente(s) ou em aberto para este equipamento. Elas passarão a aparecer como "(removida)".` : '';
        if(!confirm(`Remover o equipamento "${camName(id)}"?${warning}`)) return;
        try{
          await updateCameras(list => list.filter(c => c.id!==id));
        }catch(e){
          console.error('erro ao remover equipamento', e);
          alert('Não foi possível remover o equipamento. (' + errText(e) + ')');
        }
      };
    });
  }

  function render(){
    if(loadError){
      document.getElementById('subtitle').textContent = 'erro ao carregar';
      document.getElementById('view').innerHTML = `<div class="panel"><div class="msg err">Não foi possível carregar os dados. Verifique sua conexão e recarregue a página.</div></div>`;
      return;
    }
    if(!loaded){
      document.getElementById('view').innerHTML = `<div class="panel"><div class="empty-note">Carregando dados...</div></div>`;
      return;
    }
    renderStats();
    if(currentTab==='agenda') renderAgenda();
    else if(currentTab==='solicitar') renderSolicitar();
    else if(currentTab==='admin') renderAdmin();
  }

  document.getElementById('tabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('.tab');
    if(!btn) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    render();
  });

  (async ()=>{
    if(new URLSearchParams(location.search).get('admin')==='1'){
      currentTab = 'admin';
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelector('.tab[data-tab="admin"]').classList.add('active');
    }
    render();
    await loadState();
    render();
  })();
})();
</script>
</body>
</html>
